name: Deploy to Hostinger (production)

# Auto-deploys www.thefairytails.co.uk on every push to main.
# Secrets required (repo Settings → Secrets and variables → Actions):
#   FTP_SERVER    — from hPanel → Files → FTP Accounts (host or IP)
#   FTP_USERNAME  — dedicated FTP account whose directory IS the site docroot
#                   (domains/thefairytails.co.uk/public_html)
#   FTP_PASSWORD  — that FTP account's password
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Hiding body copy from Googlebot has cost this site more than every other defect
      # combined (71% of the pillar's clicks, July 2026; the homepage's whole-dog section
      # for three weeks). `npm run build` now runs this as `prebuild` too — it is repeated
      # here as its own named step so a failure is legible in the CI log instead of
      # surfacing as a mystery build error.
      - name: Verify scroll reveals hide nothing from Googlebot
        run: node scripts/verify-reveals.mjs

      # A phone number typed into copy goes stale silently. That is how the dead
      # grooming-era mobile ended up on six directory listings; the site must not
      # become the seventh.
      - name: Verify NAP facts come from business.ts
        run: node scripts/verify-nap.mjs

      - name: Build with Astro
        run: npm run build

      - name: Verify built URLs
        run: node scripts/verify-urls.mjs --dist

      # A malformed .htaccess takes the WHOLE site down (redirect loop), so it gates the
      # deploy rather than being checked after the fact.
      - name: Verify .htaccess redirect rules
        run: node scripts/test-htaccess.mjs

      - name: Deploy dist/ to Hostinger via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: dist/
          server-dir: ./
